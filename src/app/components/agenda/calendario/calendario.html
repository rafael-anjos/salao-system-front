<div class="calendario">
    <div class="calendario-titulo">
        <button type="button" (click)="alterarMes(-1)" aria-label="Mês anterior">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10.2 2.6 5.8 8l4.4 5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="calendario-titulo-mes-ano">{{ dataAtual | date : 'MMM yyyy' }}</div>
        <button type="button" (click)="alterarMes(+1)" aria-label="Próximo mês">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M5.8 2.6 10.2 8l-4.4 5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div class="calendario-dias-semana" aria-hidden="true">
        <span>D</span>
        <span>S</span>
        <span>T</span>
        <span>Q</span>
        <span>Q</span>
        <span>S</span>
        <span>S</span>
    </div>
    <div class="calendario-dias">
        @for (dia of diasCalendario; track $index) {
            <button
                type="button"
                class="calendario-dia"
                [class.fora]="dataAtual.getMonth() !== dia.getMonth()"
                [class.hoje]="ehHoje(dia)"
                [class.selecionado]="ehSelecionado(dia)"
                [attr.aria-current]="ehHoje(dia) ? 'date' : null"
                [attr.aria-pressed]="ehSelecionado(dia)"
                [attr.aria-label]="dia | date: 'fullDate'"
                (click)="selecionarDia(dia)">
                {{ dia | date : 'dd' }}
            </button>
        }
    </div>
</div>
