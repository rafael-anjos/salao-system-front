<div class="overlay" (click)="onCancelar()">
    <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="novo-agendamento-titulo"
        (click)="$event.stopPropagation()">
        <header class="titulo">
            <h2 id="novo-agendamento-titulo">Novo Agendamento</h2>
            <p>Preencha os campos para realizar um novo agendamento.</p>
        </header>

        <label class="field">
            Nome do cliente
            <input type="text" name="cliente" autocomplete="name">
        </label>

        <label class="field">
            Serviço a fazer
            <input type="search" name="servico">
        </label>

        <div class="row">
            <label class="field">
                Data do agendamento
                <input type="date" name="data">
            </label>
            <label class="field">
                Horário de início
                <input type="time" name="hora">
            </label>
        </div>

        <label class="field">
            Observação (opcional)
            <textarea name="observacao" rows="4"></textarea>
        </label>

        <div class="foot-btn">
            <button (click)="onCancelar()" class="cancel" type="button">Cancelar</button>
            <button (click)="onSalvar()" class="save" type="button">Salvar</button>
        </div>
    </div>
</div>
