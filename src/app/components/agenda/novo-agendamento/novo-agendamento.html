<div class="overlay" (click)="onCancelar()">
    <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="novo-agendamento-titulo"
        (click)="$event.stopPropagation()">
        <header class="titulo">
            <h2 id="novo-agendamento-titulo">{{ titulo }}</h2>
            <p>
                @if (somenteLeitura) {
                    Este atendimento já foi finalizado.
                } @else {
                    Serviço, profissional, data e horário. Cliente é opcional.
                }
            </p>
        </header>

        <form (ngSubmit)="onSalvar()">
            <app-busca-cliente
                rotulo="Cliente (opcional)"
                placeholder="Busque uma cliente ou deixe em branco para serviço avulso"
                [clienteId]="clienteId"
                [nomeLivre]="clienteNome"
                [desabilitado]="somenteLeitura"
                (clienteChange)="definirCliente($event)">
            </app-busca-cliente>

            @if (clienteId) {
                <app-contexto-ficha
                    [clienteId]="clienteId"
                    [agendamentoId]="agendamento?.id || ''"
                    [vinculo]="agendamento?.id ? '' : vinculoFicha"
                    [data]="data">
                </app-contexto-ficha>
            }

            <label class="field">
                Serviço a fazer
                <select name="servico" [(ngModel)]="servicoId" [disabled]="somenteLeitura" required>
                    <option value="">Selecione</option>
                    @for (servico of servicos; track servico.id) {
                        <option [value]="servico.id">{{ servico.nome }}</option>
                    }
                </select>
            </label>

            <label class="field">
                Profissional
                <select name="profissional" [(ngModel)]="profissionalId" [disabled]="somenteLeitura" required>
                    <option value="">Selecione</option>
                    @for (profissional of profissionais; track profissional.id) {
                        <option [value]="profissional.id">{{ profissional.nome }}</option>
                    }
                </select>
            </label>

            <div class="row">
                <label class="field">
                    Data do agendamento
                    <input type="date" name="data" [(ngModel)]="data" [disabled]="somenteLeitura" required>
                </label>
                <label class="field">
                    Horário de início
                    <input type="time" name="hora" [(ngModel)]="hora" [disabled]="somenteLeitura" required>
                </label>
            </div>

            <label class="field">
                Observação (opcional)
                <textarea name="observacao" rows="4" [(ngModel)]="observacao" [disabled]="somenteLeitura"></textarea>
            </label>

            @if (erro) {
                <p class="erro" role="alert">{{ erro }}</p>
            }

            <div class="foot-btn">
                <button (click)="onCancelar()" class="cancel" type="button">{{ somenteLeitura ? 'Fechar' : 'Cancelar' }}</button>
                @if (!somenteLeitura) {
                    <button class="save" type="submit">Salvar</button>
                }
            </div>
        </form>
    </div>
</div>
